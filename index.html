<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonara Wellness Club</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#app" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="brand">
      <div class="brand-copy">
        <div class="logo">Sonara</div>
        <div class="brand-tagline">Wellness Club</div>
      </div>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation"></nav>
      <a class="sign-in" href="#signin">Sign In</a>
    </div>
  </header>

  <main id="app" role="main"></main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>© 2026 Sonara Yoga. Personalised wellness for every life stage.</p>
      <nav>
        <a href="#faq">FAQ</a>
        <a href="#join">Join</a>
      </nav>
    </div>
    <div class="partner-strip">
      <div class="partner-copy">Trusted by</div>
      <div class="partner-logos">
        <img class="partner-logo" src="images/partner1.svg" alt="Hospital Partner" />
        <img class="partner-logo" src="images/partner2.svg" alt="Maternity Network" />
        <img class="partner-logo" src="images/partner3.svg" alt="Wellness Institute" />
      </div>
    </div>
  </footer>

  <script>
    const siteData = {
      nav: [
        { label: "Home", href: "#home" },
        { label: "Programs", href: "#programs" },
        { label: "Why Sonara", href: "#why" },
        { label: "Experts", href: "#experts" },
        { label: "FAQ", href: "#faq" },
        { label: "Join", href: "#join" }
      ],
      hero: {
        heading: "Unlimited wellness. Zero subscriptions.",
        subheading: "The Sonara Wellness Club is now free. Create your account and access hundreds of programmes, guided sessions and expert support anytime, anywhere.",
        primaryCta: { label: "Join Now", href: "#join" },
        secondaryCta: { label: "Explore Programs", href: "#programs" },
        coach: {
          name: "Sarita Kotecha",
          title: "Founder & Head Yoga Instructor",
          description: "Founder-led practices, curated playlists and evidence-based wellness guidance for modern women."
        }
      },
      sections: [
        {
          id: "why",
          type: "intro",
          title: "A premium wellness sanctuary for expectant mothers.",
          description: "Sonara Yoga brings together personalised movement, music, expert coaching and women's health guidance to support every wellness journey with calm, confidence and care.",
          bullets: [
            "Programmes that adapt to your energy and life stage.",
            "Breathwork, meditation and sleep support for inner calm.",
            "Expert women's health guidance for safe, joyful movement.",
            "Premium wellness experiences tailored to your goals."
          ]
        },
        {
          id: "programs",
          type: "categories",
          title: "Practice collections",
          categories: [
            "Pregnancy Yoga",
            "Postnatal Recovery",
            "Restorative Breathwork",
            "Sleep & Recovery",
            "Meditation",
            "Music Therapy",
            "Women's Health",
            "Community"
          ]
        },
        {
          id: "features",
          type: "feature-grid",
          title: "What makes Sonara different",
          cards: [
            {
              title: "Personalised wellness profile",
              text: "Begin with an assessment that reflects your body, mood and life-stage goals to create a truly tailored practice."
            },
            {
              title: "Adaptable prenatal programmes",
              text: "Move safely through each trimester with yoga, breathwork and recovery sessions that respond to your energy."
            },
            {
              title: "Curated wellness music",
              text: "Soundscapes and playlists designed to support relaxation, focus and deeper rest."
            },
            {
              title: "Expert-led support",
              text: "Access women's health expertise, specialist check-ins and thoughtful guidance whenever you need reassurance."
            }
          ]
        },
        {
          id: "experts",
          type: "experts",
          title: "Meet our experts",
          description: "Led by founder Sarita Kotecha, Sonara brings together senior yoga teachers and women's health specialists — including pregnancy programmes led by Dr Reena Kotecha.",
          people: [
            {
              name: "Sarita Kotecha",
              role: "Founder & Head Yoga Instructor",
              bio: "Seasoned yoga teacher and wellness coach focused on mindful movement, breath and transformational programmes for all life stages.",
              credentials: ["20+ years teaching yoga","Founder - Sonara Yoga","Mindful movement & music integration"]
            },
            {
              name: "Dr Reena Kotecha",
              role: "Pregnancy Wellness Lead",
              bio: "A women's health specialist with a gentle, evidence-based approach. Dr Reena guides prenatal members through safe yoga and recovery practices.",
              credentials: ["10+ years in women's health","Certified prenatal yoga specialist"]
            }
          ]
        },
        {
          id: "join",
          type: "benefits",
          title: "One membership, total wellness",
          items: [
            "Unlimited yoga and breathwork tailored to life stages.",
            "Holistic support for movement, rest and self-care.",
            "Priority access to expert guidance and retreat inspiration.",
            "A single membership designed for your wellbeing."
          ]
        },
        {
          id: "testimonial",
          type: "testimonial",
          testimonials: [
            { quote: "Sonara feels like a personal wellness concierge. Every class, playlist and plan is exactly what I need.", author: "Maya R." },
            { quote: "The prenatal flows are gentle, effective and helped me regain strength during my second trimester.", author: "Aisha P., mum-to-be" },
            { quote: "Dr Reena's guidance eased my worries — I felt supported and informed the whole way.", author: "Lena K., expectant mother" }
          ]
        },
        {
          id: "faq",
          type: "faq",
          title: "Frequently Asked Questions",
          questions: [
            { q: "How do I join Sonara Yoga?", a: "Create an account, complete your wellness profile, and begin personalised sessions instantly." },
            { q: "What does it cost?", a: "Choose the plan that fits your needs—everything from core access to premium concierge support for your wellness journey." },
            { q: "What content is available?", a: "Yoga, breathwork, meditation, recovery, soothing music, women's health guidance and retreat inspiration." },
            { q: "Which devices can I use?", a: "Practice seamlessly on desktop, tablet and mobile — anytime, anywhere." }
          ]
        },
        {
          id: "final-cta",
          type: "call-to-action",
          heading: "Begin your wellness journey today.",
          button: { label: "Join Sonara Yoga", href: "#join" }
        }
      ]
    };

    function renderNav(items) {
      return items.map(item => `<a href="${item.href}">${item.label}</a>`).join('');
    }

    function renderSection(section) {
      switch (section.type) {
        case 'intro':
          return `
            <section id="${section.id}" class="section intro-section">
              <div class="intro-copy">
                <h2>${section.title}</h2>
                <p>${section.description}</p>
              </div>
              <ul class="intro-list">
                ${section.bullets.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </section>
          `;
        case 'categories':
          return `
            <section id="${section.id}" class="section categories-section">
              <h2>${section.title}</h2>
              <div class="categories-grid">
                ${section.categories.map(item => `<span class="category-pill">${item}</span>`).join('')}
              </div>
            </section>
          `;
        case 'feature-grid':
          return `
            <section id="${section.id}" class="section features-section">
              <h2>${section.title}</h2>
              <div class="feature-grid">
                ${section.cards.map(card => `
                  <article class="feature-card">
                    <h3>${card.title}</h3>
                    <p>${card.text}</p>
                  </article>
                `).join('')}
              </div>
            </section>
          `;
        case 'experts':
          return `
            <section id="${section.id}" class="section experts-section">
              <div class="section-header">
                <h2>${section.title}</h2>
                <p>${section.description}</p>
              </div>
              <div class="experts-grid">
                ${section.people.map(person => `
                  <article class="expert-card">
                    <div class="profile-mark">${person.name.split(' ').map(n => n.charAt(0)).join('')}</div>
                    <h3>${person.name}</h3>
                    <p class="expert-role">${person.role}</p>
                    <div class="expert-credentials">
                      ${person.credentials ? person.credentials.map(cred => `<span>${cred}</span>`).join('') : ''}
                    </div>
                    <p class="expert-bio">${person.bio}</p>
                  </article>
                `).join('')}
              </div>
            </section>
          `;
        case 'benefits':
          return `
            <section id="${section.id}" class="section benefits-section">
              <h2>${section.title}</h2>
              <ul>
                ${section.items.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </section>
          `;
        case 'testimonial':
          return `
            <section id="${section.id}" class="section testimonial-section">
              <h2>What expecting mothers say</h2>
              <div class="testimonials-grid">
                ${section.testimonials ? section.testimonials.map(t => `
                  <article class="testimonial-card">
                    <p>“${t.quote}”</p>
                    <footer>— ${t.author}</footer>
                  </article>
                `).join('') : ''}
              </div>
            </section>
          `;
        case 'faq':
          return `
            <section id="${section.id}" class="section faq-section">
              <h2>${section.title}</h2>
              <div class="faq-grid">
                ${section.questions.map(item => `
                  <article class="faq-card">
                    <h3>${item.q}</h3>
                    <p>${item.a}</p>
                  </article>
                `).join('')}
              </div>
            </section>
          `;
        case 'call-to-action':
          return `
            <section id="${section.id}" class="section final-cta-section">
              <div class="final-cta-copy">
                <h2>${section.heading}</h2>
                <a class="button primary" href="${section.button.href}">${section.button.label}</a>
              </div>
            </section>
          `;
        default:
          return '';
      }
    }

    function renderApp() {
      const hero = `
        <section id="home" class="hero-section">
          <div class="hero-grid">
            <div class="hero-copy">
              <span class="eyebrow">Founder-led yoga and wellbeing</span>
              <h1>${siteData.hero.heading}</h1>
              <p>${siteData.hero.subheading}</p>
              <div class="hero-actions">
                <a class="button primary" href="${siteData.hero.primaryCta.href}">${siteData.hero.primaryCta.label}</a>
                <a class="button secondary" href="${siteData.hero.secondaryCta.href}">${siteData.hero.secondaryCta.label}</a>
              </div>
              <div class="hero-coach-card">
                <img src="images/sarita.svg" alt="Sarita Kotecha" class="hero-coach-image" />
                <div class="hero-coach-copy">
                  <p class="coach-role">${siteData.hero.coach.title} — ${siteData.hero.coach.name}</p>
                  <p>${siteData.hero.coach.description}</p>
                </div>
              </div>
            </div>
            <aside class="hero-visual">
              <div class="hero-visual-card">
                <div class="visual-badge">Signature Programs</div>
                <h2>Founder-led practices for mindful living</h2>
                <p>Curated yoga, breathwork and music practices designed by Sarita to support strength, calm and recovery across life stages.</p>
                <div class="visual-pill-row">
                  <span>Personalised programmes</span>
                  <span>Mindful music curation</span>
                </div>
              </div>
            </aside>
          </div>
          <div class="hero-highlights">
            <span>Evidence-based prenatal yoga</span>
            <span>Restorative soundscapes</span>
            <span>Expert women's health support</span>
            <span>Personalised wellbeing insights</span>
          </div>
        </section>
      `;

      return hero + siteData.sections.map(renderSection).join('');
    }

    document.getElementById('main-nav').innerHTML = renderNav(siteData.nav);
    document.getElementById('app').innerHTML = renderApp();
  </script>
</body>
</html>
